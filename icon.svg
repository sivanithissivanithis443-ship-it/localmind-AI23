<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30" />
      <stop offset="50%" stop-color="#243b55" />
      <stop offset="100%" stop-color="#5146e5" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />

  <!-- Bot Head Base -->
  <rect x="136" y="160" width="240" height="190" rx="44" fill="#0f172a" stroke="#6366f1" stroke-width="8" filter="url(#glow)" />

  <!-- Antenna -->
  <line x1="256" y1="160" x2="256" y2="100" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="90" r="22" fill="#10b981" />
  <circle cx="256" cy="90" r="10" fill="#ffffff" />

  <!-- Ears / Audio nodes -->
  <rect x="110" y="215" width="26" height="80" rx="12" fill="#6366f1" />
  <rect x="376" y="215" width="26" height="80" rx="12" fill="#6366f1" />

  <!-- Eyes (Glowing emerald screens) -->
  <rect x="180" y="215" width="48" height="38" rx="14" fill="#10b981" />
  <rect x="284" y="215" width="48" height="38" rx="14" fill="#10b981" />
  <circle cx="196" cy="230" r="7" fill="#ffffff" />
  <circle cx="300" cy="230" r="7" fill="#ffffff" />

  <!-- Mouth Display -->
  <rect x="200" y="285" width="112" height="20" rx="10" fill="#1e293b" />
  <line x1="216" y1="295" x2="296" y2="295" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8" />

  <!-- Offline Badge (Green Dot + Lightning) -->
  <g transform="translate(320, 310)">
    <circle cx="48" cy="48" r="42" fill="#0f172a" stroke="#10b981" stroke-width="6" />
    <path d="M52 24 L34 50 L48 50 L44 72 L62 46 L48 46 Z" fill="#10b981" />
  </g>
</svg>
